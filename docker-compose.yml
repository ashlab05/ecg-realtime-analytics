# ============================================================
# ECG Real-Time Analytics — full local stack
#
#   docker compose up --build
#
# Services:
#   kafka        — Apache Kafka (KRaft mode, no Zookeeper)
#   postgres     — PostgreSQL for predictions
#   api          — FastAPI (REST + WebSocket, Kafka producer/consumer)
#   spark        — Spark Structured Streaming inference job
#   dashboard    — React dashboard (nginx) at http://localhost:3000
#   kafka-ui     — Redpanda Console for topic inspection (optional)
# ============================================================

name: ecg-realtime-analytics

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: ecg-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Listener plumbing: PLAINTEXT for containers, external for host tools.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_KRAFT_CLUSTER_ID: "ecg-realtime-analytics-cluster-0001"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: ecg-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      for topic in ecg-events ecg-predictions ecg-errors; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1
      done
      echo 'Kafka topics ready.'
      "

  postgres:
    image: postgres:16-alpine
    container_name: ecg-postgres
    environment:
      POSTGRES_DB: ecg_analytics
      POSTGRES_USER: ecg
      POSTGRES_PASSWORD: ecg_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecg -d ecg_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ecg-api
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql+psycopg2://ecg:ecg_secret@postgres:5432/ecg_analytics
      POSTGRES_HOST: postgres
      ECG_DATASET_PATH: /app/data/raw/MIT-BIH Arrhythmia Database.csv
      # Broker switch: MESSAGE_BROKER=redis on the host (or .env) flips the
      # API onto Redis Streams — see docs/REDIS_STREAMS.md.
      MESSAGE_BROKER: ${MESSAGE_BROKER:-kafka}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      # Dataset for sampling + logs.
      - ./data/raw:/app/data/raw:ro
      - ./logs:/app/logs
      # Mount trained models over the baked-in copies (dev convenience).
      - ./models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: ecg-spark
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPARK_MASTER: local[*]
      SPARK_CHECKPOINT_DIR: /tmp/spark-checkpoints/ecg
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
      - spark-checkpoints:/tmp/spark-checkpoints
    restart: on-failure

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: ecg-dashboard
    depends_on:
      - api
    ports:
      - "3000:80"

  # Optional: topic inspector at http://localhost:8080
  kafka-ui:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: ecg-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8080:8080"
    profiles: ["ui"]

  # ============================================================
  # EXPERIMENTAL: Redis Streams alternative to Kafka.
  #
  #   docker compose --profile redis up --build
  #
  # Runs redis + the API + the Redis inference worker instead of the
  # Kafka/Spark leg (those services are still started unless excluded
  # with `--scale kafka=0 --scale spark=0`). See docs/REDIS_STREAMS.md.
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: ecg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    profiles: ["redis"]

  redis-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ecg-redis-worker
    command: ["python", "-m", "streaming.redis_inference_worker"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      MESSAGE_BROKER: redis
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    restart: on-failure
    profiles: ["redis"]

volumes:
  kafka-data:
  postgres-data:
  spark-checkpoints:
  redis-data:
