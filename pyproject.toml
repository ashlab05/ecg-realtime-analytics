[project]
name = "ecg-realtime-analytics"
version = "0.1.0"
description = "Deep Learning-Based Framework for Real-Time ECG Arrhythmia Classification in Big Data Environments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ECG Real-Time Analytics" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "xgboost>=2.0",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "kafka-python>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
streaming = ["pyspark>=3.5"]
explain = ["shap>=0.44"]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
